<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>E-Coupon Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
      background:#0c0718;color:#fff;margin:0;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;
      padding:16px;
    }
    h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em}

    /* ---- SCANNER STAGE ---- */
    #stage{
      width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;
    }
    #video-wrap{
      position:relative;width:100%;
      aspect-ratio:3/4;border-radius:24px;overflow:hidden;
      background:#1a1140;
      box-shadow:0 24px 50px -22px rgba(124,58,237,.65);
    }
    #video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    #overlay{position:absolute;inset:0;pointer-events:none}
    #overlay::before,#overlay::after,
    #overlay span::before,#overlay span::after{
      content:"";position:absolute;width:34px;height:34px;
      border:3px solid #c084fc;
    }
    #overlay::before{top:14%;left:14%;border-right:none;border-bottom:none;border-top-left-radius:10px}
    #overlay::after {top:14%;right:14%;border-left:none;border-bottom:none;border-top-right-radius:10px}
    #overlay span::before{bottom:14%;left:14%;border-right:none;border-top:none;border-bottom-left-radius:10px}
    #overlay span::after {bottom:14%;right:14%;border-left:none;border-top:none;border-bottom-right-radius:10px}

    #message{
      margin-top:14px;font-size:15px;font-weight:600;
      text-align:center;min-height:20px;padding:0 10px;
    }
    .success{color:#10b981}
    .error  {color:#f87171}
    .info   {color:#c084fc}
    #status{
      margin-top:6px;font-size:12.5px;color:#9d94c4;
      text-align:center;max-width:400px;line-height:1.5;
    }
    #debug{
      margin-top:10px;font-size:10px;color:#6f5fa8;
      font-family:monospace;text-align:center;
      max-width:400px;word-break:break-all;
    }

    /* ---- RESULT SCREEN ---- */
    #resultScreen{
      position:fixed;inset:0;z-index:100;
      display:none;flex-direction:column;align-items:center;justify-content:center;
      padding:28px;text-align:center;
      animation:fadeIn .25s ease;
    }
    #resultScreen.on{display:flex}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    #resultScreen.ok  { background:linear-gradient(160deg,#059669,#10b981); }
    #resultScreen.err { background:linear-gradient(160deg,#7c3aed,#4c1d95); }

    .result-ico{
      width:110px;height:110px;border-radius:50%;
      background:rgba(255,255,255,.22);
      display:grid;place-items:center;
      font-size:56px;color:#fff;
      animation:popIn .45s cubic-bezier(.22,1.4,.4,1);
    }
    @keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

    .result-title{
      color:#fff;font-size:30px;font-weight:800;
      letter-spacing:-.03em;margin-top:20px;
    }
    .result-msg{
      color:rgba(255,255,255,.92);font-size:15px;
      max-width:340px;line-height:1.55;margin-top:6px;
    }
    .result-card{
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.28);
      border-radius:20px;padding:18px 24px;color:#fff;
      width:100%;max-width:340px;margin-top:22px;
    }
    .result-card .amt{font-size:36px;font-weight:800;letter-spacing:-.04em}
    .result-card .nm {font-size:15px;font-weight:650;margin-top:3px}
    .result-card .rs {font-size:13px;opacity:.85;margin-top:2px}
    .result-card .meta{font-size:11px;opacity:.65;margin-top:8px;font-family:ui-monospace,monospace}

    .result-btn{
      margin-top:28px;padding:16px 44px;border-radius:16px;border:none;
      background:#fff;color:#1a1140;font-weight:750;font-size:16px;
      cursor:pointer;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);
      transition:transform .15s ease;
    }
    .result-btn:active{transform:scale(.97)}
  </style>
</head>
<body>

<h2>Scan Coupon</h2>

<div id="stage">
  <div id="video-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="overlay"><span></span></div>
  </div>
  <p id="message" class="info">Starting camera…</p>
  <p id="status">Point the camera at the QR code — full frame is scanned</p>
  <div id="debug"></div>
</div>

<!-- Full-screen result overlay -->
<div id="resultScreen">
  <div class="result-ico" id="resultIco">✓</div>
  <div class="result-title" id="resultTitle">Redeemed!</div>
  <div class="result-msg" id="resultMsg">Coupon marked as used.</div>
  <div class="result-card" id="resultCard" style="display:none;">
    <div class="amt" id="resultAmt"></div>
    <div class="nm"  id="resultName"></div>
    <div class="rs"  id="resultReason"></div>
    <div class="meta" id="resultMeta"></div>
  </div>
  <button class="result-btn" id="scanNextBtn">Scan Next Coupon</button>
</div>

<script>
// ================================================================
// ⚠️ CONFIG — must match Code.gs exactly
// ================================================================
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/thebigcarrot.ca/s/AKfycbyNfMFI5Oims_2q5NIlIyFZtxiQryu2nkdT9Hw3D995sQ74yN0Gjk3NqOdiWeUrSanfcA/exec';
const API_SECRET      = 'ecp-live-9f4K2pQ8xW7nH3jM5tR6vY1bL0dN4sA';
// ================================================================

const video        = document.getElementById('video');
const messageEl    = document.getElementById('message');
const statusEl     = document.getElementById('status');
const debugEl      = document.getElementById('debug');
const resultScreen = document.getElementById('resultScreen');
const resultIco    = document.getElementById('resultIco');
const resultTitle  = document.getElementById('resultTitle');
const resultMsg    = document.getElementById('resultMsg');
const resultCard   = document.getElementById('resultCard');
const resultAmt    = document.getElementById('resultAmt');
const resultName   = document.getElementById('resultName');
const resultReason = document.getElementById('resultReason');
const resultMeta   = document.getElementById('resultMeta');
const scanNextBtn  = document.getElementById('scanNextBtn');

// --- scanner state ---
let scanLoopId      = null;
let barcodeDetector = null;
let canvas          = null;
let ctx             = null;
let cameraStream    = null;
let lastScannedCode = null;
let lastScannedAt   = 0;

function setMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = type || 'info';
}
function debug(text) {
  debugEl.textContent = text ? String(text).slice(0, 200) : '';
  if (text) console.log('[ECP]', text);
}
function money(n) {
  const v = Number(n) || 0;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// ================================================================
// CAMERA
// ================================================================
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setMessage('Camera API not available', 'error');
    statusEl.textContent = 'Open this page over HTTPS in Safari or Chrome.';
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1280 },
        height: { ideal: 1280 }
      },
      audio: false
    });
    video.srcObject = cameraStream;
    await video.play();
    setMessage('Ready — point at the QR', 'info');
    statusEl.textContent = 'Full frame is scanned';
    startScanLoop();
  } catch (err) {
    console.error(err);
    setMessage('Camera blocked: ' + (err.name || err.message), 'error');
    statusEl.textContent = 'Grant camera permission and reload the page.';
  }
}

// ================================================================
// SCAN LOOP (stops completely once a code is detected)
// ================================================================
async function startScanLoop() {
  if (!canvas) {
    canvas = document.createElement('canvas');
    ctx    = canvas.getContext('2d', { willReadFrequently: true });
  }

  // Try native BarcodeDetector first
  if (!barcodeDetector && 'BarcodeDetector' in window) {
    try {
      const fmts = await BarcodeDetector.getSupportedFormats();
      if (fmts.includes('qr_code')) {
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
        debug('BarcodeDetector active');
      }
    } catch (e) { /* fall back */ }
  }
  if (!barcodeDetector) debug('Using jsQR fallback');

  // Cancel any previous loop
  if (scanLoopId) {
    cancelAnimationFrame(scanLoopId);
    scanLoopId = null;
  }

  const tick = async () => {
    if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
      let code = null;
      try {
        if (barcodeDetector) {
          const codes = await barcodeDetector.detect(video);
          if (codes && codes.length > 0 && codes[0].rawValue) {
            code = codes[0].rawValue;
          }
        }
        if (!code) {
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qr  = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
          if (qr && qr.data) code = qr.data;
        }
      } catch (e) { debug('scan err: ' + e.message); }

      if (code && code.indexOf('ECP-') === 0) {
        // ---- COOLDOWN: ignore the same code for 3s after a scan ----
        const now = Date.now();
        if (code === lastScannedCode && now - lastScannedAt < 3000) {
          // still cooling down — keep looping without acting on it
        } else {
          lastScannedCode = code;
          lastScannedAt   = now;

          // 🛑 STOP THE LOOP HARD — no more scans until user taps "Scan Next"
          stopScanLoop();
          setMessage('Found — redeeming…', 'info');
          statusEl.textContent = 'Please wait…';

          // Redeem, then show persistent result
          redeemToken(code.trim());
          return; // exits tick — loop is dead
        }
      }
    }
    scanLoopId = requestAnimationFrame(tick);
  };

  tick();
}

function stopScanLoop() {
  if (scanLoopId) {
    cancelAnimationFrame(scanLoopId);
    scanLoopId = null;
  }
}

// ================================================================
// JSONP REDEEM
// ================================================================
function jsonpRedeem(token) {
  return new Promise((resolve, reject) => {
    const cbName = 'ecpCb_' + Date.now() + Math.floor(Math.random() * 1e6);
    let done = false;

    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('TIMEOUT'));
    }, 12000);

    function cleanup() {
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      const s = document.getElementById(cbName + '_s');
      if (s) s.remove();
    }

    window[cbName] = function (data) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    const s = document.createElement('script');
    s.id  = cbName + '_s';
    s.src = APPS_SCRIPT_URL +
      '?action=redeem' +
      '&token='    + encodeURIComponent(token) +
      '&secret='   + encodeURIComponent(API_SECRET) +
      '&device=github-scanner' +
      '&callback=' + cbName +
      '&_=' + Date.now();

    s.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('SCRIPT_ERROR'));
    };
    document.body.appendChild(s);
  });
}

// ================================================================
// SHOW RESULT — always stops and waits for user action
// ================================================================
function showResultScreen(type, title, msg, coupon, meta) {
  resultScreen.className = type; // 'ok' or 'err'
  resultScreen.classList.add('on');

  resultIco.textContent   = type === 'ok' ? '✓' : '✕';
  resultTitle.textContent = title;
  resultMsg.textContent   = msg || '';

  if (coupon) {
    resultCard.style.display = 'block';
    resultAmt.textContent    = money(coupon.amount);
    resultName.textContent   = coupon.name || '';
    resultReason.textContent = coupon.reason || '';
    resultMeta.textContent   = meta || '';
  } else {
    resultCard.style.display = 'none';
  }

  if (navigator.vibrate) {
    navigator.vibrate(type === 'ok' ? 200 : [100, 50, 100]);
  }
}

function hideResultScreen() {
  resultScreen.classList.remove('on');
  resultScreen.className = '';
}

async function redeemToken(token) {
  try {
    const data = await jsonpRedeem(token);

    if (data.ok) {
      showResultScreen(
        'ok',
        'Redeemed!',
        'Coupon marked as used. It cannot be reused.',
        data.coupon,
        data.coupon ? data.coupon.token : ''
      );
    } else if (data.code === 'ALREADY_USED') {
      showResultScreen(
        'err',
        'Already Redeemed',
        'This coupon has already been used. Do not accept it again.',
        data.coupon,
        data.coupon && data.coupon.redeemedAt
          ? 'Redeemed ' + new Date(data.coupon.redeemedAt).toLocaleString('en-US')
          : ''
      );
    } else if (data.code === 'EXPIRED') {
      showResultScreen(
        'err',
        'Coupon Expired',
        data.message || 'This coupon is past its expiry date.',
        data.coupon,
        data.coupon && data.coupon.expiresAt
          ? 'Expired ' + new Date(data.coupon.expiresAt).toLocaleDateString('en-US')
          : ''
      );
    } else if (data.code === 'VOID') {
      showResultScreen(
        'err',
        'Coupon Cancelled',
        'This coupon has been voided by an administrator.',
        data.coupon,
        ''
      );
    } else {
      showResultScreen(
        'err',
        'Invalid Coupon',
        data.message || 'This coupon was not recognized.',
        data.coupon,
        ''
      );
    }
  } catch (err) {
    if (err.message === 'TIMEOUT') {
      showResultScreen(
        'err',
        'Server Timeout',
        'The server did not respond. Check the connection and try again.',
        null,
        ''
      );
      debug('Check that doGet is deployed and access is "Anyone".');
    } else {
      showResultScreen(
        'err',
        'Network Error',
        'Could not reach the server. Verify the scanner URL and try again.',
        null,
        ''
      );
      debug('Script load failed. Check /exec URL + deployment access.');
    }
  }
}

// ================================================================
// RESET AND SCAN AGAIN
// ================================================================
function resetAndScan() {
  hideResultScreen();
  setMessage('Ready — point at the QR', 'info');
  statusEl.textContent = 'Full frame is scanned';
  debug('');

  // Give the cooldown a moment to expire, then restart the loop
  setTimeout(() => {
    startScanLoop();
  }, 350);
}

scanNextBtn.addEventListener('click', resetAndScan);

// ================================================================
// BOOT
// ================================================================
window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>
