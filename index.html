<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>E-Coupon Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #0c0718;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .screen {
      display: none;
      min-height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    .screen.on { display: flex; }

    /* ================= LANDING ================= */
    #landingScreen {
      background: linear-gradient(160deg, #0c0718 0%, #1a1140 100%);
      text-align: center;
    }
    .brand-mark {
      width: 96px; height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, #7c3aed, #a855f7, #c084fc);
      display: grid; place-items: center;
      font-weight: 800; font-size: 46px;
      color: #fff;
      box-shadow: 0 22px 55px -22px rgba(124,58,237,.95);
      margin-bottom: 26px;
    }
    #landingScreen h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -.04em;
      margin: 0 0 10px;
    }
    #landingScreen .tagline {
      font-size: 15px;
      color: #b8aee0;
      margin: 0 0 42px;
      max-width: 340px;
      line-height: 1.55;
    }
    .btn-primary {
      padding: 20px 56px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.01em;
      cursor: pointer;
      box-shadow: 0 20px 42px -12px rgba(124,58,237,.85);
      transition: transform .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary svg {
      width: 22px; height: 22px;
      fill: none; stroke: currentColor; stroke-width: 2;
    }
    .version-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 11px;
      color: #8b7fc0;
      font-family: ui-monospace, monospace;
      padding: 6px 10px;
      background: rgba(124,58,237,.15);
      border-radius: 8px;
      letter-spacing: .04em;
    }

    /* ================= SCAN ================= */
    #scanningScreen {
      background: #000;
      padding: 0;
      justify-content: flex-start;
    }
    .scan-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: calc(20px + env(safe-area-inset-top)) 20px 40px;
      background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, transparent 100%);
      z-index: 2;
      text-align: center;
    }
    .scan-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      color: #fff;
    }
    .scan-header p {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: rgba(255,255,255,.7);
    }
    #video-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #scanFrame {
      position: absolute;
      top: 50%; left: 50%;
      width: 70vw;
      max-width: 320px;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #scanFrame::before, #scanFrame::after,
    #scanFrame span::before, #scanFrame span::after {
      content: ""; position: absolute;
      width: 40px; height: 40px;
      border: 4px solid #c084fc;
      filter: drop-shadow(0 0 10px rgba(192,132,252,.9));
    }
    #scanFrame::before { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
    #scanFrame::after  { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 12px; }
    #scanFrame span::before { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 12px; }
    #scanFrame span::after  { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 12px; }
    .scan-footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(0,0,0,.8) 0%, transparent 100%);
      z-index: 2;
      display: flex;
      justify-content: center;
    }
    .btn-stop {
      padding: 14px 32px;
      border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #scanDebug {
      position: absolute;
      top: calc(110px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(192,132,252,.75);
      font-family: ui-monospace, monospace;
      max-width: 90vw;
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }

    /* ================= RESULT ================= */
    #resultScreen {
      text-align: center;
      padding: 28px;
    }
    #resultScreen.ok  { background: linear-gradient(160deg, #059669, #10b981); }
    #resultScreen.err { background: linear-gradient(160deg, #7c3aed, #4c1d95); }

    .result-ico {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,.22);
      display: grid; place-items: center;
      font-size: 60px; color: #fff;
      animation: popIn .5s cubic-bezier(.22,1.4,.4,1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    .result-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-top: 22px;
      color: #fff;
    }
    .result-msg {
      font-size: 15px;
      color: rgba(255,255,255,.92);
      max-width: 340px;
      line-height: 1.55;
      margin-top: 8px;
    }
    .result-card {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 22px;
      padding: 20px 26px;
      width: 100%;
      max-width: 340px;
      margin-top: 24px;
      color: #fff;
    }
    .result-card .amt { font-size: 38px; font-weight: 800; letter-spacing: -.04em; }
    .result-card .nm  { font-size: 15px; font-weight: 650; margin-top: 4px; }
    .result-card .rs  { font-size: 13px; opacity: .85; margin-top: 2px; }
    .result-card .meta {
      font-size: 11px;
      opacity: .7;
      margin-top: 10px;
      font-family: ui-monospace, monospace;
      word-break: break-all;
      line-height: 1.4;
    }
    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 28px;
      width: 100%;
      max-width: 340px;
    }
    .btn-white {
      padding: 16px 32px;
      border-radius: 16px;
      border: none;
      background: #fff;
      color: #1a1140;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 12px 30px -10px rgba(0,0,0,.4);
      transition: transform .15s ease;
    }
    .btn-white:active { transform: scale(.97); }
    .btn-ghost-white {
      padding: 14px 32px;
      border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,.4);
      background: transparent;
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ========== SCREEN 1: LANDING ========== -->
<div id="landingScreen" class="screen on">
  <div class="brand-mark">E</div>
  <h1>E-Coupon Scanner</h1>
  <p class="tagline">Scan customer QR codes to redeem coupons instantly. Each coupon can only be used once.</p>
  <button class="btn-primary" id="startBtn">
    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    Open Scanner
  </button>
  <div class="version-badge">v3.1 · Nov 2026</div>
</div>

<!-- ========== SCREEN 2: SCANNING (id fixed to match code) ========== -->
<div id="scanningScreen" class="screen">
  <div class="scan-header">
    <h2>Scanning Coupon</h2>
    <p>Point the camera at the QR code</p>
  </div>
  <div id="video-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="scanFrame"><span></span></div>
  </div>
  <div id="scanDebug"></div>
  <div class="scan-footer">
    <button class="btn-stop" id="stopBtn">✕ Stop</button>
  </div>
</div>

<!-- ========== SCREEN 3: RESULT ========== -->
<div id="resultScreen" class="screen">
  <div class="result-ico" id="resultIco">✓</div>
  <div class="result-title" id="resultTitle">Redeemed!</div>
  <div class="result-msg" id="resultMsg">Coupon marked as used.</div>
  <div class="result-card" id="resultCard">
    <div class="amt" id="resultAmt">$0</div>
    <div class="nm" id="resultName"></div>
    <div class="rs" id="resultReason"></div>
    <div class="meta" id="resultMeta"></div>
  </div>
  <div class="result-actions">
    <button class="btn-white" id="scanNextBtn">📷 Scan Next Coupon</button>
    <button class="btn-ghost-white" id="doneBtn">Back to Home</button>
  </div>
</div>

<script>
// ================================================================
// ⚠️ CONFIG — must match Code.gs
// ================================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';
const API_SECRET      = 'CHANGE_ME_TO_A_LONG_RANDOM_STRING_2024';
// ================================================================

const video        = document.getElementById('video');
const scanDebug    = document.getElementById('scanDebug');
const resultScreen = document.getElementById('resultScreen');
const resultIco    = document.getElementById('resultIco');
const resultTitle  = document.getElementById('resultTitle');
const resultMsg    = document.getElementById('resultMsg');
const resultCard   = document.getElementById('resultCard');
const resultAmt    = document.getElementById('resultAmt');
const resultName   = document.getElementById('resultName');
const resultReason = document.getElementById('resultReason');
const resultMeta   = document.getElementById('resultMeta');

let appState        = 'landing';
let cameraStream    = null;
let scanLoopId      = null;
let barcodeDetector = null;
let canvas          = null;
let ctx             = null;

function debug(msg) {
  scanDebug.textContent = msg ? String(msg).slice(0, 150) : '';
  if (msg) console.log('[ECP]', msg);
}

function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  const el = document.getElementById(name + 'Screen');
  if (!el) {
    console.error('[ECP] Screen element not found:', name + 'Screen');
    return;
  }
  el.classList.add('on');
  appState = name;
  window.scrollTo(0, 0);
}

function money(n) {
  const v = Number(n) || 0;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// ================================================================
// CAMERA
// ================================================================
async function openCamera() {
  if (cameraStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('Camera not supported. Use HTTPS in Safari or Chrome.');
  }
  cameraStream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width:  { ideal: 1280 },
      height: { ideal: 1280 }
    },
    audio: false
  });
  video.srcObject = cameraStream;
  await video.play();
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  video.srcObject = null;
}

// ================================================================
// SCAN LOOP
// ================================================================
async function startScanLoop() {
  if (appState !== 'scanning') return;

  if (!canvas) {
    canvas = document.createElement('canvas');
    ctx = canvas.getContext('2d', { willReadFrequently: true });
  }

  if (!barcodeDetector && 'BarcodeDetector' in window) {
    try {
      const fmts = await BarcodeDetector.getSupportedFormats();
      if (fmts.includes('qr_code')) {
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
        debug('BarcodeDetector active');
      }
    } catch (e) { /* fallback */ }
  }
  if (!barcodeDetector) debug('jsQR mode');

  cancelScanLoop();

  const tick = async () => {
    if (appState !== 'scanning') return;

    if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
      let code = null;
      try {
        if (barcodeDetector) {
          const codes = await barcodeDetector.detect(video);
          if (codes && codes.length > 0 && codes[0].rawValue) {
            code = codes[0].rawValue;
          }
        }
        if (!code) {
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qr  = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
          if (qr && qr.data) code = qr.data;
        }
      } catch (e) { /* ignore */ }

      if (appState !== 'scanning') return;

      if (code && code.indexOf('ECP-') === 0) {
        cancelScanLoop();
        if (navigator.vibrate) navigator.vibrate(80);
        debug('Found: ' + code);
        redeemAndShowResult(code.trim());
        return;
      }
    }

    if (appState === 'scanning') {
      scanLoopId = requestAnimationFrame(tick);
    }
  };

  tick();
}

function cancelScanLoop() {
  if (scanLoopId) {
    cancelAnimationFrame(scanLoopId);
    scanLoopId = null;
  }
}

// ================================================================
// FLOW: LANDING → SCANNING
// ================================================================
document.getElementById('startBtn').addEventListener('click', async () => {
  try {
    switchScreen('scanning');
    await openCamera();
    startScanLoop();
  } catch (err) {
    console.error('[ECP] Camera error:', err);
    cancelScanLoop();
    closeCamera();
    switchScreen('landing');
    alert('Could not open camera.\n\n' + (err.message || err.name || 'Unknown error') +
          '\n\nPlease make sure:\n• You granted camera permission\n• You are on HTTPS (github.io)\n• Your browser supports camera access');
  }
});

// ================================================================
// FLOW: SCANNING → LANDING (Stop)
// ================================================================
document.getElementById('stopBtn').addEventListener('click', () => {
  cancelScanLoop();
  closeCamera();
  switchScreen('landing');
});

// ================================================================
// JSONP API
// ================================================================
function jsonpRedeem(token) {
  return new Promise((resolve, reject) => {
    const cbName = 'ecpCb_' + Date.now() + Math.floor(Math.random() * 1e6);
    let done = false;

    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('TIMEOUT'));
    }, 15000);

    function cleanup() {
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      const s = document.getElementById(cbName + '_s');
      if (s) s.remove();
    }

    window[cbName] = function (data) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    const s = document.createElement('script');
    s.id  = cbName + '_s';
    s.src = APPS_SCRIPT_URL +
      '?action=redeem' +
      '&token='    + encodeURIComponent(token) +
      '&secret='   + encodeURIComponent(API_SECRET) +
      '&device=github-scanner' +
      '&callback=' + cbName +
      '&_=' + Date.now();

    s.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('SCRIPT_ERROR'));
    };
    document.body.appendChild(s);
  });
}

// ================================================================
// REDEEM → RESULT
// ================================================================
async function redeemAndShowResult(token) {
  // Switch to result screen IMMEDIATELY (before network call)
  resultScreen.classList.remove('ok', 'err');
  resultScreen.classList.add('ok');
  resultIco.textContent    = '⏳';
  resultTitle.textContent  = 'Checking…';
  resultMsg.textContent    = 'Verifying coupon with server';
  resultCard.style.display = 'none';
  switchScreen('result');

  try {
    const data = await jsonpRedeem(token);

    if (data.ok) {
      showResult('ok', '✓', 'Redeemed!',
        'Coupon marked as used. It cannot be reused.',
        data.coupon, '');
    } else if (data.code === 'ALREADY_USED') {
      showResult('err', '✕', 'Already Redeemed',
        'This coupon has already been used. Do not accept it again.',
        data.coupon,
        data.coupon && data.coupon.redeemedAt
          ? 'Redeemed: ' + new Date(data.coupon.redeemedAt).toLocaleString('en-US')
          : '');
    } else if (data.code === 'EXPIRED') {
      showResult('err', '✕', 'Coupon Expired',
        data.message || 'This coupon is past its expiry date.',
        data.coupon,
        data.coupon && data.coupon.expiresAt
          ? 'Expired: ' + new Date(data.coupon.expiresAt).toLocaleDateString('en-US')
          : '');
    } else if (data.code === 'VOID') {
      showResult('err', '✕', 'Coupon Cancelled',
        'This coupon has been voided by an administrator.',
        data.coupon, '');
    } else if (data.code === 'UNAUTHORIZED') {
      showResult('err', '⚠', 'Server Rejected',
        'API secret does not match. Check configuration.', null, '');
    } else {
      showResult('err', '✕', 'Invalid Coupon',
        data.message || 'This coupon was not recognized.',
        data.coupon, '');
    }
  } catch (err) {
    if (err.message === 'TIMEOUT') {
      showResult('err', '⚠', 'Server Timeout',
        'The server did not respond. Check connection and try again.', null, '');
    } else {
      showResult('err', '⚠', 'Network Error',
        'Could not reach the server. Verify the scanner URL.', null, '');
    }
  }
}

function showResult(type, icon, title, msg, coupon, meta) {
  resultScreen.classList.remove('ok', 'err');
  resultScreen.classList.add(type === 'ok' ? 'ok' : 'err');

  resultIco.textContent    = icon;
  resultTitle.textContent  = title;
  resultMsg.textContent    = msg || '';

  if (coupon) {
    resultCard.style.display = 'block';
    resultAmt.textContent    = money(coupon.amount);
    resultName.textContent   = coupon.name || '';
    resultReason.textContent = coupon.reason || '';
    resultMeta.textContent   = meta || coupon.token || '';
  } else {
    resultCard.style.display = 'none';
  }

  if (navigator.vibrate) {
    navigator.vibrate(type === 'ok' ? 200 : [100, 50, 100]);
  }
}

// ================================================================
// RESULT → SCANNING (Scan Next)
// ================================================================
document.getElementById('scanNextBtn').addEventListener('click', async () => {
  try {
    resultScreen.classList.remove('ok', 'err');
    switchScreen('scanning');
    await openCamera();
    startScanLoop();
  } catch (err) {
    console.error('[ECP] Camera error:', err);
    cancelScanLoop();
    closeCamera();
    switchScreen('landing');
    alert('Camera error: ' + (err.message || err.name));
  }
});

// ================================================================
// RESULT → LANDING (Done)
// ================================================================
document.getElementById('doneBtn').addEventListener('click', () => {
  resultScreen.classList.remove('ok', 'err');
  closeCamera();
  switchScreen('landing');
});
</script>
</body>
</html>
