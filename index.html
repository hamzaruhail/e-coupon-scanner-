<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>E-Coupon Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
      background:#0c0718;color:#fff;margin:0;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;
      padding:16px;
    }
    h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em}
    #video-wrap{
      position:relative;width:100%;max-width:440px;
      aspect-ratio:3/4;border-radius:24px;overflow:hidden;
      background:#1a1140;
      box-shadow:0 24px 50px -22px rgba(124,58,237,.65);
    }
    #video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    #overlay{position:absolute;inset:0;pointer-events:none}
    #overlay::before,#overlay::after,
    #overlay span::before,#overlay span::after{
      content:"";position:absolute;width:34px;height:34px;
      border:3px solid #c084fc;
    }
    #overlay::before{top:14%;left:14%;border-right:none;border-bottom:none;border-top-left-radius:10px}
    #overlay::after {top:14%;right:14%;border-left:none;border-bottom:none;border-top-right-radius:10px}
    #overlay span::before{bottom:14%;left:14%;border-right:none;border-top:none;border-bottom-left-radius:10px}
    #overlay span::after {bottom:14%;right:14%;border-left:none;border-top:none;border-bottom-right-radius:10px}
    #message{
      margin-top:16px;font-size:16px;font-weight:600;
      text-align:center;min-height:22px;padding:0 10px;
    }
    .success{color:#10b981}
    .error  {color:#f87171}
    .info   {color:#c084fc}
    #status{
      margin-top:8px;font-size:12.5px;color:#9d94c4;
      text-align:center;max-width:400px;line-height:1.5;
    }
    #debug{
      margin-top:12px;font-size:10px;color:#6f5fa8;
      font-family:monospace;text-align:center;
      max-width:400px;word-break:break-all;
    }
    #result{
      margin-top:16px;padding:16px 22px;border-radius:16px;
      background:rgba(124,58,237,.18);border:1px solid rgba(168,85,247,.35);
      max-width:400px;width:100%;display:none;
    }
    #result .amt{font-size:32px;font-weight:800;letter-spacing:-.04em}
    #result .nm{font-size:14px;font-weight:650;margin-top:2px}
    #result .rs{font-size:12.5px;opacity:.8;margin-top:2px}
  </style>
</head>
<body>

<h2>Scan Coupon</h2>
<div id="video-wrap">
  <video id="video" playsinline muted autoplay></video>
  <div id="overlay"><span></span></div>
</div>
<p id="message" class="info">Starting camera…</p>
<p id="status">Point the camera at the QR code — full frame is scanned</p>
<div id="result"></div>
<div id="debug"></div>

<script>
// ================================================================
// ⚠️ CONFIG — change these two values to match your setup
// ================================================================
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/thebigcarrot.ca/s/AKfycbyNfMFI5Oims_2q5NIlIyFZtxiQryu2nkdT9Hw3D995sQ74yN0Gjk3NqOdiWeUrSanfcA/exec';
const API_SECRET      = 'ecp-live-9f4K2pQ8xW7nH3jM5tR6vY1bL0dN4sA';
// ================================================================

const video    = document.getElementById('video');
const messageEl = document.getElementById('message');
const statusEl  = document.getElementById('status');
const debugEl   = document.getElementById('debug');
const resultEl  = document.getElementById('result');

let isProcessing = false;
let scanLoopId   = null;
let barcodeDetector = null;

function setMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = type || 'info';
}
function debug(text) {
  debugEl.textContent = text ? String(text).slice(0, 200) : '';
  if (text) console.log('[ECP]', text);
}
function showResult(coupon) {
  if (!coupon) return;
  resultEl.style.display = 'block';
  resultEl.innerHTML =
    '<div class="amt">$' + Number(coupon.amount).toFixed(2).replace(/\.00$/, '') + '</div>' +
    '<div class="nm">' + (coupon.name || '') + '</div>' +
    '<div class="rs">' + (coupon.reason || '') + '</div>';
}

// ================================================================
// 1. START CAMERA
// ================================================================
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setMessage('Camera API not available', 'error');
    statusEl.textContent = 'Open this page over HTTPS in Safari or Chrome.';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1280 },
        height: { ideal: 1280 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setMessage('Ready — point at the QR', 'info');
    startScanLoop();
  } catch (err) {
    console.error(err);
    setMessage('Camera blocked: ' + (err.name || err.message), 'error');
    statusEl.textContent = 'Grant camera permission and reload the page.';
  }
}

// ================================================================
// 2. SCAN LOOP
// ================================================================
async function startScanLoop() {
  // Try native BarcodeDetector first (iOS 17+, Android Chrome — near-instant)
  if ('BarcodeDetector' in window) {
    try {
      const fmts = await BarcodeDetector.getSupportedFormats();
      if (fmts.includes('qr_code')) {
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
        debug('BarcodeDetector active');
      }
    } catch (e) { /* fall back to jsQR */ }
  }
  if (!barcodeDetector) debug('Using jsQR fallback');

  const canvas = document.createElement('canvas');
  const ctx    = canvas.getContext('2d', { willReadFrequently: true });

  const tick = async () => {
    if (isProcessing) {
      scanLoopId = requestAnimationFrame(tick);
      return;
    }
    if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
      let code = null;
      try {
        if (barcodeDetector) {
          const codes = await barcodeDetector.detect(video);
          if (codes && codes.length > 0 && codes[0].rawValue) {
            code = codes[0].rawValue;
          }
        }
        if (!code) {
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qr  = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
          if (qr && qr.data) code = qr.data;
        }
      } catch (e) { debug('scan err: ' + e.message); }

      if (code) {
        debug('Detected: ' + code);
        if (code.indexOf('ECP-') === 0) {
          isProcessing = true;
          setMessage('Found — redeeming…', 'info');
          try { await redeemToken(code.trim()); }
          finally { isProcessing = false; }
          scanLoopId = requestAnimationFrame(tick);
          return;
        } else {
          debug('Ignored non-ECP QR');
        }
      }
    }
    scanLoopId = requestAnimationFrame(tick);
  };
  tick();
}

// ================================================================
// 3. REDEEM via JSONP
// ================================================================
function jsonpRedeem(token) {
  return new Promise((resolve, reject) => {
    const cbName = 'ecpCb_' + Date.now() + Math.floor(Math.random() * 1e6);
    let done = false;

    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('TIMEOUT'));
    }, 12000);

    function cleanup() {
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      const s = document.getElementById(cbName + '_s');
      if (s) s.remove();
    }

    window[cbName] = function (data) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    const s = document.createElement('script');
    s.id  = cbName + '_s';
    s.src = APPS_SCRIPT_URL +
      '?action=redeem' +
      '&token='    + encodeURIComponent(token) +
      '&secret='   + encodeURIComponent(API_SECRET) +
      '&device=github-scanner' +
      '&callback=' + cbName +
      '&_=' + Date.now();

    s.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('SCRIPT_ERROR'));
    };
    document.body.appendChild(s);
  });
}

async function redeemToken(token) {
  try {
    setMessage('Redeeming…', 'info');
    const data = await jsonpRedeem(token);

    if (data.ok) {
      setMessage('✅ Redeemed!', 'success');
      showResult(data.coupon);
      if (navigator.vibrate) navigator.vibrate(200);
      setTimeout(() => {
        resultEl.style.display = 'none';
        setMessage('Ready — point at the QR', 'info');
      }, 4000);
    } else if (data.code === 'ALREADY_USED') {
      setMessage('❌ ' + (data.message || 'Already used'), 'error');
      showResult(data.coupon);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      setTimeout(() => {
        resultEl.style.display = 'none';
        setMessage('Ready — point at the QR', 'info');
      }, 4000);
    } else {
      setMessage('❌ ' + (data.message || 'Invalid'), 'error');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      setTimeout(() => setMessage('Ready — point at the QR', 'info'), 3000);
    }
  } catch (err) {
    if (err.message === 'TIMEOUT') {
      setMessage('⚠️ Server timeout', 'error');
      debug('Check that doGet is deployed and access is "Anyone".');
    } else {
      setMessage('⚠️ Network error', 'error');
      debug('Script load failed. Check the /exec URL and deployment access.');
    }
    setTimeout(() => setMessage('Ready — point at the QR', 'info'), 3000);
  }
}

window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>
